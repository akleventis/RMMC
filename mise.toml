[tools]
node = "24"
gitleaks = "8"

[tasks.setup]
description = "Install the secret-scanning hook and dependencies"
run = [
  "git config core.hooksPath .githooks",
  "npm ci",
]

[tasks.dev]
description = "Vite dev server (reads .env)"
run = "npm run dev"

[tasks.build]
description = "Production build"
run = "npm run build"

[tasks.test]
description = "No tests yet"
run = "echo 'No tests yet'"

[tasks.lint]
description = "ESLint"
run = "npm run lint"
